name: Feature Request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or frustration you're experiencing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playground
        - Note manager
        - Demo — vote
        - Demo — claim
        - Demo — attestation
        - Demo — payroll
        - Wallet / storage
        - Prover worker
        - Documentation
        - CI / tooling
        - Accessibility
        - Other
    validations:
      required: true
