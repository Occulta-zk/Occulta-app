name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues**: Please report via SECURITY.md, not this form.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Chrome 125 / macOS 14
  - type: checkboxes
    id: secrets
    attributes:
      label: Privacy confirmation
      description: Please confirm before submitting.
      options:
        - label: This report contains no mnemonics, seeds, notes, or other secrets.
          required: true
