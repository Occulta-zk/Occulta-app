name: E2E (nightly — testnet)

on:
  schedule:
    # 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright — testnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
      NEXT_PUBLIC_INDEXER_URL: ${{ secrets.TESTNET_INDEXER_URL }}
      NEXT_PUBLIC_RELAYER_URL: ${{ secrets.TESTNET_RELAYER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Run E2E suite
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
